---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: latest

"on":
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - latest/*
      - .github/workflows/docker.yml
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: amd64
            platform: linux/amd64

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          images: |
            webhippie/dst
            quay.io/webhippie/dst
            ghcr.io/dockhippie/dst
          labels: |
            org.opencontainers.image.vendor=Webhippie
            maintainer=Thomas Boerger <thomas@webhippie.de>

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Setup Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Hub login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Quay login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Ghcr login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: latest/
          provenance: false
          file: latest/Dockerfile.${{ matrix.variant.arch }}
          platforms: ${{ matrix.variant.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            webhippie/dst:latest-${{ matrix.variant.arch }}
            quay.io/webhippie/dst:latest-${{ matrix.variant.arch }}
            ghcr.io/dockhippie/dst:latest-${{ matrix.variant.arch }}

  manifest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    needs:
      - docker

    steps:
      - name: Hub login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Quay login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Ghcr login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifests
        run: |
          repos=("webhippie/dst:latest" "quay.io/webhippie/dst:latest" "ghcr.io/dockhippie/dst:latest")
          archs=("amd64")

          retry() {
            local max=5 delay=10
            for i in $(seq 1 $max); do
              "$@" && return 0
              echo "Attempt $i failed. Retrying in ${delay}s..."
              sleep $delay
              delay=$(( delay * 2 ))
            done
            return 1
          }

          for arch in "${archs[@]}"; do
            for repo in "${repos[@]}"; do
              echo "Checking ${repo}-${arch}..."
              if ! retry docker manifest inspect "${repo}-${arch}" > /dev/null 2>&1; then
                echo "::error ::Image ${repo}-${arch} is missing"
                exit 1
              fi
              echo "${repo}-${arch} does exist"
            done
          done

          for repo in "${repos[@]}"; do
            retry manifest-tool push from-args --platforms linux/amd64 --template $repo-ARCH --target $repo
          done

...
